# Runs file arch-nope-split-r1e-60m (public code export): the entries only; paths use ${DATA_ROOT} and ${RUN_ROOT}.
# python scripts/run_entry.py runs/arch-nope-split-r1e-60m.yaml --list   |   --name <entry> --data-root ... --run-root ... [--dry-run]
shards: "${DATA_ROOT}/phase0-v2-t64k/train"
eval_dir: "${DATA_ROOT}/eval/phase0-v2-t64k"
runs:
  - name: cap4nope1-r1e-mxl-a-s1
    config: configs/v2/control-a-60m.yaml
    seed: 1
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
  - name: cap4nope1-r1e-mxl-a-s2
    config: configs/v2/control-a-60m.yaml
    seed: 2
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
  - name: cap2nope3-r1e-mxl-a-s1
    config: configs/v2/control-a-60m.yaml
    seed: 1
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[2,3,4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
  - name: cap2nope3-r1e-mxl-a-s2
    config: configs/v2/control-a-60m.yaml
    seed: 2
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[2,3,4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
