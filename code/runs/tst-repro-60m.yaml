# Runs file tst-repro-60m (public code export): the entries only; paths use ${DATA_ROOT} and ${RUN_ROOT}.
# python scripts/run_entry.py runs/tst-repro-60m.yaml --list   |   --name <entry> --data-root ... --run-root ... [--dry-run]
shards: "${DATA_ROOT}/phase0-v2-t64k/train"
eval_dir: "${DATA_ROOT}/eval/phase0-v2-t64k"
runs:
  - name: tstr-lrp-5e-4
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=1622, optim.warmup_steps=162, optim.lr=0.0005, log_stream_rms_every=100]
  - name: tstr-lrp-1e-3
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=1622, optim.warmup_steps=162, optim.lr=0.001, log_stream_rms_every=100]
  - name: tstr-lrp-2e-3
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=1622, optim.warmup_steps=162, optim.lr=0.002, log_stream_rms_every=100]
  - name: tstr-chk-s6-sw3
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=8, optim.warmup_steps=2, log_stream_rms_every=100, "tst.schedule=[[0,6],[3,1]]", tst.keep_optimizer_state=true]
  - name: tstr-base-s1
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=6487, log_stream_rms_every=100, "checkpoint_steps=[1622,1946,6487]", optim.lr=0.001]
  - name: tstr-s6r30-s1
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set:
      - steps=6487
      - log_stream_rms_every=100
      - "checkpoint_steps=[1946,6487]"
      - "tst.schedule=[[0,6],[1946,1]]"
      - tst.keep_optimizer_state=true
      - optim.lr=0.001
  - name: tstr-s4r25-s1
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set:
      - steps=6487
      - log_stream_rms_every=100
      - "checkpoint_steps=[1622,6487]"
      - "tst.schedule=[[0,4],[1622,1]]"
      - tst.keep_optimizer_state=true
      - optim.lr=0.001
  - name: tstr-base-s2
    config: configs/v2/tst-repro-60m.yaml
    seed: 2
    set: [steps=6487, log_stream_rms_every=100, "checkpoint_steps=[1946,6487]", optim.lr=0.001]
  - name: tstr-s6r30-s2
    config: configs/v2/tst-repro-60m.yaml
    seed: 2
    set:
      - steps=6487
      - log_stream_rms_every=100
      - "checkpoint_steps=[1946,6487]"
      - "tst.schedule=[[0,6],[1946,1]]"
      - tst.keep_optimizer_state=true
      - optim.lr=0.001
  - name: tstr-s6r30-reset-s1
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=6487, log_stream_rms_every=100, "checkpoint_steps=[1946,6487]", "tst.schedule=[[0,6],[1946,1]]", optim.lr=0.001]
  - name: tstr-lrp-25e-5
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=1622, optim.warmup_steps=162, optim.lr=0.00025, log_stream_rms_every=100]
  - name: tstr-lrp-4e-3
    config: configs/v2/tst-repro-60m.yaml
    seed: 1
    set: [steps=1622, optim.warmup_steps=162, optim.lr=0.004, log_stream_rms_every=100]
