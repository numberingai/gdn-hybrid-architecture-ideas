# Runs file arch-qmix-tst-r1e-60m (public code export): the entries only; paths use ${DATA_ROOT} and ${RUN_ROOT}.
# python scripts/run_entry.py runs/arch-qmix-tst-r1e-60m.yaml --list   |   --name <entry> --data-root ... --run-root ... [--dry-run]
shards: "${DATA_ROOT}/phase0-v2-t64k/train"
eval_dir: "${DATA_ROOT}/eval/phase0-v2-t64k"
runs:
  - name: tst-s4r25-r1e-mxl-a-s1
    config: configs/v2/control-a-60m.yaml
    seed: 1
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[3,4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1622,1]]"
  - name: tst-s4r25-r1e-mxl-a-s2
    config: configs/v2/control-a-60m.yaml
    seed: 2
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[3,4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1622,1]]"
  - name: wsl-qmix-tst-s4r25-r1e-mxl-a-s1
    config: configs/v2/control-a-60m.yaml
    seed: 1
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[3,4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
      - model.encoder.gdn_write_mix=layer
      - optim.zero_gate_decay=none
      - model.encoder.gdn_write_variant=qmix
      - optim.mix_query_decay=none_qmix
      - "tst.schedule=[[0,4],[1622,1]]"
  - name: wsl-qmix-tst-s4r25-r1e-mxl-a-s2
    config: configs/v2/control-a-60m.yaml
    seed: 2
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[3,4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[1622,3244,4865,6487]"
      - log_stream_rms_every=100
      - model.encoder.gdn_write_mix=layer
      - optim.zero_gate_decay=none
      - model.encoder.gdn_write_variant=qmix
      - optim.mix_query_decay=none_qmix
      - "tst.schedule=[[0,4],[1622,1]]"
