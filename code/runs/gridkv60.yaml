# Runs file gridkv60 (public code export): the entries only; paths use ${DATA_ROOT} and ${RUN_ROOT}.
# python scripts/run_entry.py runs/gridkv60.yaml --list   |   --name <entry> --data-root ... --run-root ... [--dry-run]
shards: "${DATA_ROOT}/phase0-v2-t64k/train"
eval_dir: "${DATA_ROOT}/eval/phase0-v2-t64k"
runs:
  - name: gkv22-60-s1
    config: configs/v2/control-a-60m.yaml
    seed: 1
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[4]"
      - steps=6487
      - model.encoder.attn_res=block_entry
      - "checkpoint_steps=[4865,5838,6163,6487]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1622,1]]"
      - model.tie_embeddings=true
      - model.ffn_hidden=1512
      - model.encoder.attention.kv_sharing=grid
      - model.encoder.attention.grid_rows=2
      - model.encoder.attention.grid_cols=2
      - model.encoder.attention.row_dim=64
      - model.encoder.attention.col_dim=64
      - model.encoder.attention.heads_per_cell=1
  - name: gqa2-60-s1
    config: configs/v2/control-a-60m.yaml
    seed: 1
    set:
      - model.encoder.attention.temperature=ssmax
