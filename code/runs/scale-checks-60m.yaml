    after: abl-base-mxl-a-s1
    after_step: 4865
    set:
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[3,4]"
      - steps=84163
      - "checkpoint_steps=[10520,21040,42081,84163]"
      - log_stream_rms_every=100
      - optim.decay_fraction=0.0
      - stage=continue
      - "resume_from=${RUN_ROOT}/abl-base-mxl-a-s1/checkpoints/step_00004865.pt"
      - data.union_order=sets_in_order
