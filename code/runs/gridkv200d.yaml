# Runs file gridkv200d (public code export): the entries only; paths use ${DATA_ROOT} and ${RUN_ROOT}.
# python scripts/run_entry.py runs/gridkv200d.yaml --list   |   --name <entry> --data-root ... --run-root ... [--dry-run]
shards: "${DATA_ROOT}/phase0-v2-t64k/train"
eval_dir: "${DATA_ROOT}/eval/phase0-v2-t64k"
runs:
  - name: gkv22p-200-s3
    config: configs/v2/control-a-200m.yaml
    seed: 3
    set:
      - model.encoder.n_layers=28
      - model.encoder.attention.n_kv_heads=1
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[6]"
      - steps=5597
      - model.encoder.attn_res=block_entry
      - optim.warmup_steps=800
      - optim.decay_fraction=0.0
      - "checkpoint_steps=[5597]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1999,1]]"
      - model.tie_embeddings=true
      - model.ffn_hidden=2336
      - model.encoder.attention.kv_sharing=grid
      - model.encoder.attention.grid_rows=2
      - model.encoder.attention.grid_cols=2
      - model.encoder.attention.row_dim=64
      - model.encoder.attention.col_dim=64
      - model.encoder.attention.heads_per_cell=2
  - name: gqa2-200-s3
    config: configs/v2/control-a-200m.yaml
    seed: 3
    set:
      - model.encoder.n_layers=28
      - model.encoder.attention.n_kv_heads=2
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[6]"
      - steps=5597
      - model.encoder.attn_res=block_entry
      - optim.warmup_steps=800
      - optim.decay_fraction=0.0
      - "checkpoint_steps=[5597]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1999,1]]"
      - model.tie_embeddings=true
      - model.ffn_hidden=2336
  - name: gkv22p-200-s3-c
    config: configs/v2/control-a-200m.yaml
    seed: 3
    shards: "${DATA_ROOT}/phase-c-200m-t64k/train"
    after: gkv22p-200-s3
    after_step: 5597
    set:
      - model.encoder.n_layers=28
      - model.encoder.attention.n_kv_heads=1
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[6]"
      - steps=7996
      - model.encoder.attn_res=block_entry
      - optim.warmup_steps=800
      - optim.decay_fraction=0.2
      - "checkpoint_steps=[7996]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1999,1]]"
      - model.tie_embeddings=true
      - model.ffn_hidden=2336
      - stage=continue
      - data_start_step=5597
      - "resume_from=${RUN_ROOT}/gkv22p-200-s3/checkpoints/step_00005597.pt"
      - model.encoder.attention.kv_sharing=grid
      - model.encoder.attention.grid_rows=2
      - model.encoder.attention.grid_cols=2
      - model.encoder.attention.row_dim=64
      - model.encoder.attention.col_dim=64
      - model.encoder.attention.heads_per_cell=2
  - name: gqa2-200-s3-c
    config: configs/v2/control-a-200m.yaml
    seed: 3
    shards: "${DATA_ROOT}/phase-c-200m-t64k/train"
    after: gqa2-200-s3
    after_step: 5597
    set:
      - model.encoder.n_layers=28
      - model.encoder.attention.n_kv_heads=2
      - model.encoder.attention.temperature=ssmax
      - model.encoder.attention.rope_max_distance=2048
      - "model.encoder.nope_global_layers=[6]"
      - steps=7996
      - model.encoder.attn_res=block_entry
      - optim.warmup_steps=800
      - optim.decay_fraction=0.2
      - "checkpoint_steps=[7996]"
      - log_stream_rms_every=100
      - "tst.schedule=[[0,4],[1999,1]]"
      - model.tie_embeddings=true
      - model.ffn_hidden=2336
      - stage=continue
      - data_start_step=5597
      - "resume_from=${RUN_ROOT}/gqa2-200-s3/checkpoints/step_00005597.pt"
